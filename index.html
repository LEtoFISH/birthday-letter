<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>生日快乐｜一封专属的信</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            min-height: 100vh;
            background: #fef6f9;
            font-family: "PingFang SC", "Microsoft Yahei", sans-serif;
            padding: 40px 20px;
            color: #333;
            line-height: 1.8;
        }
        .container {
            max-width: 680px;
            margin: 0 auto;
            background: #fff;
            padding: 50px 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }
        h1 {
            text-align: center;
            color: #e87ea1;
            margin-bottom: 30px;
            font-size: 26px;
        }
        .content {
            font-size: 16px;
            color: #444;
        }
        .content p {
            margin-bottom: 20px;
        }
        .sign {
            text-align: right;
            margin-top: 40px;
            color: #666;
        }
        .heart {
            color: #e87ea1;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>致我最珍贵的你：</h1>
        <div class="content">
            <p>生日快乐！🎂</p>
            <p>又陪你走过了一整年的春夏秋冬，很开心我的生命里有你出现。</p>
            <p>我不太会说华丽的话，但真心希望你：永远平安、永远开心、永远被温柔对待。不用事事完美，只要你活得自在、尽兴、闪闪发光就好。</p>
            <p>难过的时候记得回头，我一直都在。无论未来是什么样子，我都会站在你这边，陪你碎碎念念，也陪你岁岁年年。</p>
            <p>新的一岁，愿你：眼里有光，心中有爱，所求皆如愿，所行皆坦途。</p>
            <p>生日快乐，我的好朋友！<span class="heart">❤️</span></p>
            <p class="sign">你的朋友</p>
            <p class="sign">2026.08.10</p>
        </div>
    </div>
</body>
</html>
