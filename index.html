<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>生日快乐｜专属信件</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            min-height: 100vh;
            background: #fef2f7;
            font-family: "PingFang SC", "Microsoft Yahei", sans-serif;
            overflow-x: hidden;
        }
        /* 礼物弹窗遮罩 */
        .gift-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0,0,0,0.75);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }
        .gift-box {
            background: #fff;
            padding: 60px 40px;
            border-radius: 24px;
            text-align: center;
            box-shadow: 0 0 40px #ffb6c1;
        }
        .gift-box h2 {
            font-size: 32px;
            color: #e86c9c;
            margin-bottom: 35px;
        }
        .receive-btn {
            padding: 14px 42px;
            font-size: 18px;
            border: none;
            background: #e86c9c;
            color: white;
            border-radius: 50px;
            cursor: pointer;
            transition: 0.3s;
        }
        .receive-btn:hover {
            background: #d45b89;
            transform: scale(1.05);
        }
        /* 信件容器 默认隐藏 */
        .letter-wrap {
            max-width: 700px;
            margin: 0 auto;
            padding: 50px 25px;
            display: none;
        }
        .letter-card {
            background: #ffffff;
            padding: 55px 40px;
            border-radius: 22px;
            box-shadow: 0 8px 30px rgba(232, 108, 156, 0.15);
        }
        h1 {
            text-align: center;
            color: #e86c9c;
            margin-bottom: 32px;
            font-size: 28px;
        }
        .text p {
            font-size: 16px;
            line-height: 1.9;
            color: #444;
            margin-bottom: 20px;
        }
        .sign {
            margin-top: 45px;
            text-align: right;
            color: #666;
        }
        .heart {
            color: #e86c9c;
        }
        /* 音乐控制按钮 */
        .audio-btn {
            position: fixed;
            bottom: 25px;
            right: 25px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: none;
            background: #e86c9c;
            color: white;
            font-size: 20px;
            cursor: pointer;
            z-index: 99;
        }
        /* 粒子画布铺满全屏 */
        #particleCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 1;
        }
    </style>
</head>
<body>
    <!-- 粒子特效画布 -->
    <canvas id="particleCanvas"></canvas>

    <!-- 开场礼物弹窗 -->
    <div class="gift-modal" id="modal">
        <div class="gift-box">
            <h2>接收礼物</h2>
            <button class="receive-btn" id="openLetterBtn">点击拆开信件</button>
        </div>
    </div>

    <!-- 信件主体 -->
    <div class="letter-wrap" id="letterBox">
        <div class="letter-card">
            <h1>致我最珍贵的你：</h1>
            <div class="text">
                <p>生日快乐！🎂</p>
                <p>又陪你走过了一整年的春夏秋冬，很开心我的生命里有你出现。</p>
                <p>我不太会说华丽的话，但真心希望你：永远平安、永远开心、永远被温柔对待。不用事事完美，只要你活得自在、尽兴、闪闪发光就好。</p>
                <p>难过的时候记得回头，我一直都在。无论未来是什么样子，我都会站在你这边，陪你碎碎念念，也陪你岁岁年年。</p>
                <p>新的一岁，愿你：眼里有光，心中有爱，所求皆如愿，所行皆坦途。</p>
                <p>生日快乐，我的好朋友！<span class="heart">❤️</span></p>
                <div class="sign">
                    <p>你的朋友</p>
                    <p>2026.08.10</p>
                </div>
            </div>
        </div>
    </div>

    <!-- 背景音乐，修改这里的文件名和你上传的MP3完全一致 -->
    <audio id="bgMusic" loop preload="auto">
        <source src="./music/夏天的风.mp3" type="audio/mpeg">
    
    
    <button class="audio-btn" id="musicCtrl">🎵</button>

    <script>
        // 1. 弹窗点击逻辑
        const modal = document.getElementById('modal');
        const letterBox = document.getElementById('letterBox');
        const openBtn = document.getElementById('openLetterBtn');
        const music = document.getElementById('bgMusic');
        let musicPlay = false;

        openBtn.addEventListener('click', () => {
            modal.style.display = 'none';
            letterBox.style.display = 'block';
            // 打开信件自动播放音乐
            music.play().then(() => {
                musicPlay = true;
            }).catch(e => console.log("浏览器限制自动播放，手动点音乐按钮"));
        })

        // 音乐暂停/播放按钮
        const musicBtn = document.getElementById('musicCtrl');
        musicBtn.onclick = () => {
            if(musicPlay){
                music.pause();
                musicBtn.innerText = "🔇";
                musicPlay = false;
            }else{
                music.play();
                musicBtn.innerText = "🎵";
                musicPlay = true;
            }
        }

        // 2. 超多爱心粒子特效 240个满屏密集粒子
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        let particles = [];

        function resizeCanvas(){
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // 粒子类
        class Particle {
            constructor(){
                this.x = Math.random() * width;
                this.y = Math.random() * height - height;
                this.size = Math.random() * 12 + 4;
                this.speedY = Math.random() * 1.2 + 0.6;
                this.speedX = Math.random() * 1 - 0.5;
                this.opacity = Math.random() * 0.6 + 0.3;
                this.rotate = Math.random() * Math.PI * 2;
                this.rotateSpeed = Math.random() * 0.02 - 0.01;
            }
            update(){
                this.y += this.speedY;
                this.x += this.speedX;
                this.rotate += this.rotateSpeed;
                // 落到底部重新回到顶部
                if(this.y > height){
                    this.y = -20;
                    this.x = Math.random() * width;
                }
            }
            draw(){
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotate);
                ctx.beginPath();
                ctx.globalAlpha = this.opacity;
                ctx.fillStyle = "#ff8fb3";
                // 绘制爱心
                ctx.moveTo(0, 0);
                ctx.bezierCurveTo(-this.size/2, -this.size/2, -this.size, 0, 0, this.size);
                ctx.bezierCurveTo(this.size, 0, this.size/2, -this.size/2, 0, 0);
                ctx.fill();
                ctx.restore();
            }
        }

        // 生成240个粒子，满屏飘落
        function createParticles(count){
            particles = [];
            for(let i=0; i<count; i++){
                particles.push(new Particle());
            }
        }
        createParticles(240);

        // 动画循环
        function animate(){
            ctx.clearRect(0,0,width,height);
            particles.forEach(p => {
                p.update();
                p.draw();
            })
            requestAnimationFrame(animate);
        }
        animate();
    </script>
</body>
</html>
